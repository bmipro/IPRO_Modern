name: Build and deploy ASP.Net Core app to Azure Web App - ipro-prod-web
on:
  push:
    branches:
      - main
  workflow_dispatch:
# ONE deployment at a time ACROSS BOTH APPS — this group name is shared with
# main_ipro-prod-admin.yml on purpose (A2-H6). Web and Admin run schema repair against the SAME
# MySQL database at startup; per-app groups let one push start both deploys at once and
# interleave those repairs. The shared group serializes them (a push now deploys web, then
# admin, ~12 min total instead of ~6 parallel — that cost is the point). DOCS/INVARIANTS.md
# rule 6 documents this group name; change it in BOTH files and the doc together, or not at
# all. cancel-in-progress stays false: an in-flight deploy must complete (cancelling
# mid-deploy can leave the site half-updated); the newest queued run then deploys after it.
concurrency:
  group: deploy-ipro-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Restore dependencies
        run: dotnet restore IPRO.sln
      - name: Build
        run: dotnet build IPRO.sln --configuration Release
      - name: Publish
        run: dotnet publish src/IPRO.Web/IPRO.Web.csproj -c Release -o ./publish -p:SourceRevisionId=${{ github.sha }}
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_125A52B329834373956E555A056DFA8A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F94B3760110944BDB097E394CD3F9702 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2102CCD4C4DB4B7590BD6CA997D6A93C }}
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ipro-prod-web'
          slot-name: 'Production'
          package: .

      # WEBSITE_RUN_FROM_PACKAGE=1 means the worker serves an already-mounted package: the deploy
      # above can succeed while production keeps running the PREVIOUS build. Observed on 2026-08-08,
      # three deploys in a row. Basic tier has no deployment slots, so a swap (which would restart by
      # definition) is not available -- an explicit restart is.
      #
      # CONDITIONAL since 2026-09-01 (445). The deploy's own restart is usually already under way by
      # the time this step runs, and firing a second restart into it killed the app mid startup-DDL,
      # left a metadata lock behind, and took production down for 24 minutes. So: give the deploy's
      # restart 90 seconds to serve the new build, and restart ONLY if the OLD build is still
      # answering. Never restart an app that is in the middle of starting.
      - name: Restart only if the new package is not being served yet
        run: |
          expected='${{ github.sha }}'
          url='https://app.iproadvisers.com/health/version'
          for attempt in $(seq 1 9); do
            actual=$(curl -fsS --max-time 10 "$url" 2>/dev/null || echo '')
            if [ "$actual" = "$expected" ]; then
              echo "new build already serving after $attempt check(s); no restart needed"
              exit 0
            fi
            echo "  check $attempt: serving '${actual:-<no response>}'"
            sleep 10
          done
          echo "old build still serving after 90s; restarting once so the new package is mounted (445)"
          az webapp restart --name 'ipro-prod-web' --resource-group 'ipro-production'

      # ...and do not report success until the commit we just pushed is the commit answering.
      # /health only proves the app is up, which it was throughout the incident this guards against.
      - name: Verify the deployed build is actually serving
        run: |
          expected='${{ github.sha }}'
          url='https://app.iproadvisers.com/health/version'
          wait_for_build() {
            echo "waiting for $expected at $url"
            for attempt in $(seq 1 30); do
              actual=$(curl -fsS --max-time 10 "$url" 2>/dev/null || echo '')
              if [ "$actual" = "$expected" ]; then
                echo "confirmed live after $attempt attempt(s)"
                return 0
              fi
              echo "  attempt $attempt: serving '${actual:-<no response>}'"
              sleep 10
            done
            return 1
          }
          if wait_for_build; then exit 0; fi

          # second-chance restart (445): on 2026-09-01 the scripted restart above left the worker
          # container STOPPED -- the front door returned 503 on every path for 24 minutes while this
          # step failed correctly and nothing remediated it or paged anyone. One more restart was the
          # whole fix. Try it once here, where the deploy credentials already are, before failing.
          echo "::warning::ipro-prod-web is not serving $expected after 5 minutes; restarting once more (445)."
          az webapp restart --name 'ipro-prod-web' --resource-group 'ipro-production'
          if wait_for_build; then exit 0; fi

          echo "::error::ipro-prod-web is still not serving $expected after a second restart and 10 minutes."
          exit 1
