name: Build and deploy ASP.Net Core app to Azure Web App - ipro-prod-admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ONE deployment at a time ACROSS BOTH APPS — this group name is shared with
# main_ipro-prod-web.yml on purpose (A2-H6). Web and Admin run schema repair against the SAME
# MySQL database at startup; per-app groups let one push start both deploys at once and
# interleave those repairs. The shared group serializes them (a push now deploys web, then
# admin, ~12 min total instead of ~6 parallel — that cost is the point). DOCS/INVARIANTS.md
# rule 6 documents this group name; change it in BOTH files and the doc together, or not at
# all. cancel-in-progress stays false: an in-flight deploy must complete (cancelling
# mid-deploy can leave the site half-updated); the newest queued run then deploys after it.
concurrency:
  group: deploy-ipro-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore IPRO.sln

      - name: Build
        run: dotnet build IPRO.sln --configuration Release --no-restore

      - name: Publish admin app
        run: dotnet publish src/IPRO.Admin/IPRO.Admin.csproj -c Release -o ./publish-admin -p:SourceRevisionId=${{ github.sha }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: admin-app
          path: ./publish-admin

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      # id-token is for the Azure login below, which the restart step needs. The deploy itself still
      # uses the publish profile -- deliberately left alone rather than migrated in the same change.
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: admin-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ipro-prod-admin'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_IPRO_PROD_ADMIN }}
          package: .

      # WEBSITE_RUN_FROM_PACKAGE=1 means the worker serves an already-mounted package: the deploy
      # above can succeed while production keeps running the PREVIOUS build. Observed on 2026-08-08,
      # three deploys in a row. Basic tier has no deployment slots, so a swap (which would restart by
      # definition) is not available -- an explicit restart is.
      # The web workflow's service principal is scoped to ipro-prod-web ONLY -- it cannot restart
      # this app (AuthorizationFailed on Microsoft.Web/sites/restart/action, 2026-08-08). Granting it
      # Website Contributor on ipro-prod-admin would fix that, but that is a production permissions
      # change and the owner's call, so the restart is best-effort here and the verify step below is
      # the real gate: if the admin app does NOT pick up the new package by itself, this job fails
      # and we will know the grant is needed rather than assuming it.
      - name: Login to Azure
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_125A52B329834373956E555A056DFA8A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F94B3760110944BDB097E394CD3F9702 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2102CCD4C4DB4B7590BD6CA997D6A93C }}

      - name: Restart the app so the new package is mounted (best effort)
        run: |
          az webapp restart --name 'ipro-prod-admin' --resource-group 'ipro-production' \
            || echo "::warning::Could not restart ipro-prod-admin (no permission). Relying on the deploy's own restart; the verify step below will catch it if that is not enough."

      # ...and do not report success until the commit we just pushed is the commit answering.
      # /health only proves the app is up, which it was throughout the incident this guards against.
      - name: Verify the deployed build is actually serving
        run: |
          expected='${{ github.sha }}'
          url='https://admin.iproadvisers.com/health/version'
          wait_for_build() {
            echo "waiting for $expected at $url"
            for attempt in $(seq 1 30); do
              actual=$(curl -fsS --max-time 10 "$url" 2>/dev/null || echo '')
              if [ "$actual" = "$expected" ]; then
                echo "confirmed live after $attempt attempt(s)"
                return 0
              fi
              echo "  attempt $attempt: serving '${actual:-<no response>}'"
              sleep 10
            done
            return 1
          }
          if wait_for_build; then exit 0; fi

          # second-chance restart (445): on 2026-09-01 the scripted restart above left the worker
          # container STOPPED -- the front door returned 503 on every path for 24 minutes while this
          # step failed correctly and nothing remediated it or paged anyone. One more restart was the
          # whole fix. Try it once here, where the deploy credentials already are, before failing.
          echo "::warning::ipro-prod-admin is not serving $expected after 5 minutes; restarting once more (445)."
          az webapp restart --name 'ipro-prod-admin' --resource-group 'ipro-production' || echo "::warning::Could not restart ipro-prod-admin (no permission); the second poll below decides."
          if wait_for_build; then exit 0; fi

          echo "::error::ipro-prod-admin is still not serving $expected after a second restart and 10 minutes."
          exit 1
